# Abbreviation lexicon for the degradation model (§6.6).
#
# Expansions on the left, the abbreviation a person would actually type on the right.
# Drawn from forms observed in Contracts Finder titles and descriptions and from ordinary
# laboratory and engineering usage. Released with the code so every degraded corpus can be
# regenerated exactly.
#
# Each entry is applied whole-word only, so "temperature" does not corrupt "temperatures".

