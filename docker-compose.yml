services:
  db:
    image: postgres:16
    container_name: fces-db
    environment:
      POSTGRES_USER: fces
      POSTGRES_PASSWORD: fces
      POSTGRES_DB: fces
    ports:
      # 5433, not 5432 — avoids clashing with any local Postgres install.
      - "5433:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fces -d fces"]
      interval: 3s
      timeout: 3s
      retries: 20
