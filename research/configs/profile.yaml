# run_profile.py — corpus descriptive statistics (G1).
# Every number this produces reaches the paper through results/tables/, never by hand.

corpus_a: data/processed/corpus_a_abtbuy.parquet
corpus_a_pairs: data/processed/corpus_a_abtbuy_pairs.parquet
corpus_b: data/processed/corpus_b_contractsfinder.parquet
discard_report: data/processed/corpus_b_contractsfinder.discard_report.json
taxonomy: data/processed/cpv_taxonomy.parquet

# Both candidate sets are measured so the choice is a reported decision, not an
# ingest-time one (§4.2, Amendment 6). `adopted` names the set the study uses.
division_sets:
  ten_divisions: ["30", "31", "32", "33", "38", "39", "42", "43", "44", "48"]
  eight_divisions: ["30", "31", "32", "33", "38", "42", "43", "44"]
adopted: eight_divisions

min_examples: 50

# §4.5: a descriptive statistic about repeat notices. There is no natural-duplicate
# experiment; these counts are all the paper uses them for.
natural_duplicate_stats: true
