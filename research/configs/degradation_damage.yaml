# Measures mean normalised edit distance from source (schema.text_of, 1 - SequenceMatcher
# ratio -- the same instrument that settled the build_cf noise-parity fix, see
# test_degrade.py::TestBuildCfNoiseParity), overall and per degradation class in isolation
