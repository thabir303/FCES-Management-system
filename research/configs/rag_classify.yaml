# RQ2's language-model condition: division level, n=300 requested (supervisor ruling,
# 2026-08-21). Class level is not run this session -- see run_rag_classify.py's module
# docstring for why that is a ruling, not an omission.
#
# Committed; runners take no tuning flags.
#
# Real per-call cost measured on rag_classify_probe.yaml: ~1,400 tokens/call (verbose
# Corpus B examples plus openai/gpt-oss-120b's hidden reasoning tokens), well above the
# cascade's ~657 tok/call this session's earlier quota estimate was based on. n=300 may not
# fit inside what remains of today's allowance -- run_rag_classify.py's
# predict_whatever_completed() handles that by reporting the actually-achieved n rather
# than crashing or padding the figure back up to 300.

corpus: data/processed/corpus_b_contractsfinder.parquet
taxonomy: data/processed/cpv_taxonomy.parquet
divisions: ["30", "31", "32", "33", "38", "42", "43", "44"]

level: division
min_examples: 50

llm_sample_n: 300
llm_sample_seed: 0

# max_tokens must cover BOTH the model's internal reasoning tokens AND the visible JSON
# answer -- see rag_classify_probe.yaml's comment; 150 produced empty, schema-invalid
# completions on genuinely ambiguous records because the model spent its entire budget on
# reasoning before ever emitting an answer.
k_examples: 5
max_tokens: 1000
condition: rq2_incontext

llm_config: research/configs/llm.yaml
