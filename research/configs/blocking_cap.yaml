# What the block-size cap costs, on each corpus (§6.8; attribution for amendment 9's
# transfer figure).
#
# Committed; runners take no tuning flags.
#
# The transfer comparison reports pair completeness 0.985 on Corpus A against 0.411 on
# Corpus B under one configuration carried across unchanged. That gap is uninterpretable
# until it is known how much of it is the KEY failing on procurement text and how much is
# the absolute size cap binding on a corpus an order of magnitude larger and far more
# repetitive. `largest_block` sits exactly on the cap for Corpus B at every severity, which
# is what a binding guard looks like.

corpus_a: data/processed/corpus_a_abtbuy.parquet
corpus_a_pairs: data/processed/corpus_a_abtbuy_pairs.parquet
corpus_b: data/processed/corpus_b_contractsfinder.parquet
divisions: ["30", "31", "32", "33", "38", "42", "43", "44"]

# Severity 0.0 only. That is where Corpus B's positives are byte-identical, so any pair
# that fails to block fails for a MECHANICAL reason — a dropped gram or a title too short
# to yield `min_overlap` grams — and not because degradation destroyed the shared text.
# It is the one condition where the reading is unambiguous.
severities: [0.0]
seed: 0

scheme: sorted_ngrams
n: 3
mode: per_gram
min_overlap: 8

# Ascending, and `null` LAST — a cap can only cost itself, never a smaller one that already
# completed and was already persisted. The three finite caps carry the argument; `null` is
# the nice-to-have and is the one most likely to hit its budget on Corpus B (26k records,
# far more repetitive than Corpus A, so its high-frequency grams keep more of the incidence
# matrix dense the higher the cap climbs).
#
# Each cap runs in its own subprocess with a hard virtual-memory ceiling (RLIMIT_AS) and a
# wall-clock timeout applied from outside. Without the memory ceiling a large product can
# start swapping instead of raising MemoryError, which is silent and looks identical to
# still working — that is what happened the first time this ran. A cap that exceeds its
# budget is recorded as "no acceptable operating point at this cap", not retried.
caps:
  - value: 500
    timeout_seconds: 180
    memory_gb: 3
  - value: 2000
    timeout_seconds: 300
    memory_gb: 4
  - value: 10000
    timeout_seconds: 600
    memory_gb: 6
  - value: null
    timeout_seconds: 900
    memory_gb: 8
