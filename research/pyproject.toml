[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcesreg"
version = "0.1.0"
description = "Migration pipeline for the FCES asset register: dedup, taxonomy assignment, operating point."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

# rapidfuzz is deliberately NOT here — it belongs to system/api, where it guesses
# import column headers. No fuzzy-string matcher is part of the matching tier (§2).

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
